<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightwell Call Bridge</title>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1><span class="mark" aria-hidden="true">◈</span> Lightwell</h1>
    <p id="origin"></p>
    <p id="state" role="status">Checking this tab…</p>
    <div class="inline">
      <button id="toggle" class="primary" type="button" disabled>Enable on this origin</button>
      <button id="reload" type="button" hidden>Reload tab</button>
      <button id="studio" type="button">Open Studio</button>
    </div>
  </main>
</body>
</html>
